[package]
name = "snaptrans"
version = "0.1.0"
edition = "2021"
authors = ["WingSnap Team"]
description = "SnapTrans — Ultra-lightweight offline neural machine translation engine for desktop screenshot workflows. Powered by MarianMT ONNX with KV Cache autoregressive decoding."
license = "MIT OR Apache-2.0"
keywords = ["translation", "offline", "marian", "onnx", "kv-cache"]

[lib]
name = "snaptrans"
crate-type = ["lib"]

[dependencies]
# ONNX Runtime Rust bindings — reuses WingSnap's existing onnxruntime.dll
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }

# HuggingFace pure-Rust tokenizer (SentencePiece BPE, zero Python)
tokenizers = { version = "0.21", default-features = false, features = ["progressbar", "fancy-regex"] }

# Serialization (matches WingSnap)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
